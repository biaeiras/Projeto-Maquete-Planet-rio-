<html>

<head>
  <title>Atrações</title>
  <link rel="stylesheet" href="/publico/sitePublicoAtracoes.css">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8">

  <script src = "/publico/sitePublicoAtracao.js" defer></script>
</head>

<body>
  <header>
     <h1> Conheça nosso Museu</h1>
  </header>

  <main>
    <section class="lista-atracoes"> 
      <h2> Escolha sua próxima atração</h2>

      <div id = "atracoes-container"> 
        Atrações Aqui
      </div>

    </section>

    <section id = "detalhes-atracao" hidden> 
      <h2 id = "nome-atracao"></h2>
      <p id = "resumo-atracao"></p>
      <p id="quantidade-obras"></p>
      <div id = "obras-container"></div>

    
      <button type = "button" id="botao-enviar"> 
        Escolher essa atracao
      </button>
    
    </section>
  </main>

    <!-- Modal de detalhes da atração -->
  <div class="modal-detalhes" id="modal-detalhes" hidden>

      <div class="conteudo-modal-detalhes">

          <button type="button" id="fechar-detalhes" class="fechar-detalhes">
              &times;
          </button>

          <img id="imagem-detalhes" src="" alt="Imagem da atração">

          <div class="informacoes-detalhes">

              <h2 id="titulo-detalhes"></h2>

              <p id="resumo-detalhes"></p>

              <div class="informacoes-obras">
                  <h3>Obras desta atração</h3>

                  <div id="lista-obras">
                      <p>As informações das obras estarão disponíveis em breve.</p>
                  </div>
              </div>

          </div>

      </div>

  </div>

</body>
</html>
